<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Diário Esportivo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --campo:#0E6B3A; --campo-2:#0A5530; --giz:#FFFFFF; --ouro:#F2C230; --tinta:#1B2430;
  --fundo:#EDF1EC; --painel:#FFFFFF; --linha:#D5DDD4; --suave:#5D6B66;
  --vit:#1E9E57; --emp:#C99A12; --der:#D6453D; --sombra:0 1px 0 rgba(27,36,48,.08);
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --corpo:Barlow,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --fundo:#0F1714; --painel:#17221E; --linha:#2A3933; --tinta:#E8EEEA; --suave:#9AA9A3; --sombra:none; --campo-2:#0C4A2A;
}}
:root[data-theme="dark"]{ --fundo:#0F1714; --painel:#17221E; --linha:#2A3933; --tinta:#E8EEEA; --suave:#9AA9A3; --sombra:none; --campo-2:#0C4A2A; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--fundo);color:var(--tinta);font:16px/1.45 var(--corpo);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 14px 110px}
h1,h2,h3{font-family:var(--cond);margin:0;line-height:1.05}
h2{font-size:1.45rem;font-weight:700;margin:26px 0 10px}
.muted{color:var(--suave)}
.proto{font-size:.8rem;color:var(--suave);padding:10px 2px 0;display:flex;justify-content:space-between;gap:8px}

/* figurinha */
.figurinha{margin-top:12px;background:var(--campo);color:var(--giz);border-radius:18px;padding:16px;position:relative;overflow:hidden;border:3px solid var(--ouro)}
.figurinha::before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 100% 50%,transparent 58px,rgba(255,255,255,.18) 59px,rgba(255,255,255,.18) 61px,transparent 62px),
 linear-gradient(90deg,transparent calc(100% - 1px),rgba(255,255,255,.18) 0);pointer-events:none}
.fig-topo{display:flex;gap:14px;align-items:center;position:relative}
.foto{width:84px;height:104px;border-radius:12px;background:var(--campo-2);display:grid;place-items:center;font:800 2.2rem var(--cond);overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.35)}
.foto img{width:100%;height:100%;object-fit:cover}
.fig-nome{font:800 2.1rem/1 var(--cond)}
.fig-info{font-size:.95rem;opacity:.9;margin-top:4px}
.camisa{position:absolute;right:6px;top:-2px;font:800 5.4rem/1 var(--cond);color:var(--ouro);opacity:.95}
.fig-rodape{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;position:relative}
.fig-rodape div{background:rgba(0,0,0,.18);border-radius:10px;padding:8px 4px;text-align:center}
.fig-rodape b{display:block;font:700 1.6rem/1 var(--cond)}
.fig-rodape span{font-size:.75rem;opacity:.85}

/* filtros */
.filtros{display:grid;gap:8px;padding:14px 0 2px}
.filtros select{width:100%;background:var(--painel);border:1px solid var(--linha);border-radius:999px;padding:8px 30px 8px 12px;appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--suave) 50%),linear-gradient(135deg,var(--suave) 50%,transparent 50%);
 background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;font-size:.9rem}

.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cx{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:10px;box-shadow:var(--sombra)}
.cx b{display:block;font:700 1.7rem/1.1 var(--cond)}
.cx span{font-size:.8rem;color:var(--suave)}
.placar-geral{display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;overflow:hidden;color:#fff;text-align:center}
.placar-geral div{padding:10px 4px}.placar-geral b{font:800 2rem/1 var(--cond);display:block}.placar-geral span{font-size:.8rem}
.forma{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.forma i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 .85rem var(--cond);color:#fff;font-style:normal}
.V{background:var(--vit)}.E{background:var(--emp)}.D{background:var(--der)}
.barras{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 2px 0;border-bottom:1px solid var(--linha)}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.75rem;color:var(--suave)}
.barras s{display:block;width:100%;background:var(--campo);border-radius:5px 5px 0 0;min-height:2px;text-decoration:none}
.barras em{font-style:normal;font:700 .9rem var(--cond);color:var(--tinta)}
.rot{display:flex;gap:6px}.rot span{flex:1;text-align:center;font-size:.72rem;color:var(--suave);padding-top:3px}

/* jogos */
.mes{font:700 1rem var(--cond);color:var(--suave);margin:18px 0 6px;text-transform:capitalize}
.jogo{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:10px 12px 10px 0;margin-bottom:8px;width:100%;text-align:left;cursor:pointer;box-shadow:var(--sombra)}
.jogo>i{align-self:stretch;border-radius:0 4px 4px 0}
.jogo .adv{font:700 1.15rem/1.1 var(--cond)}
.jogo small{display:block;color:var(--suave);font-size:.8rem;margin-top:2px}
.jogo .pl{font:800 1.5rem var(--cond);white-space:nowrap;text-align:right}
.jogo .pl small{text-align:right}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--fundo);border:1px solid var(--linha);margin-right:4px}
.tag.ouro{background:var(--ouro);color:#1B2430;border-color:var(--ouro)}
.busca{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--linha);background:var(--painel);margin-top:12px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--painel);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav button{background:none;border:0;padding:10px 0 8px;font-size:.75rem;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--campo);font-weight:600}
@media (prefers-color-scheme: dark){nav button[aria-current="page"]{color:var(--ouro)}}
nav .mais{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--ouro);color:#1B2430;margin-top:-22px;border:4px solid var(--fundo);padding:0;justify-content:center}
nav .mais svg{width:26px;height:26px}

/* folha / formulários */
.veu{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:20;display:none}
.folha{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--fundo);border-radius:20px 20px 0 0;z-index:21;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.folha.on{transform:none}.veu.on{display:block}
@media (prefers-reduced-motion:reduce){.folha{transition:none}}
.folha .in{max-width:560px;margin:0 auto;padding:6px 16px 24px}
.folha header{position:sticky;top:0;background:var(--fundo);display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;z-index:1}
.folha header h3{font-size:1.5rem}
.x{background:none;border:0;font-size:1.6rem;line-height:1;padding:4px 8px;cursor:pointer;color:var(--suave)}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font:700 1.15rem var(--cond);margin-bottom:8px;padding:0}
label{display:block;font-size:.85rem;color:var(--suave);margin-bottom:10px}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--linha);background:var(--painel);color:var(--tinta);font-size:1rem;min-height:44px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tripla{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.placar-in{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--campo);color:#fff;border-radius:14px;padding:12px}
.placar-in label{color:rgba(255,255,255,.85);text-align:center;margin:0}
.placar-in input{text-align:center;font:800 2.2rem var(--cond);background:rgba(0,0,0,.2);border:0;color:#fff}
.placar-in .vs{font:700 1.4rem var(--cond)}
.res-auto{text-align:center;margin-top:8px;font:700 1.1rem var(--cond)}
.passo{display:flex;align-items:center;justify-content:space-between;background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:4px;margin-top:4px}
.passo button{width:40px;height:40px;border-radius:8px;border:0;background:var(--fundo);font-size:1.3rem;cursor:pointer}
.passo output{font:700 1.4rem var(--cond)}
.chk{display:flex;align-items:center;gap:10px;background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;color:var(--tinta);font-size:.95rem}
.chk input{width:20px;height:20px;margin:0;min-height:0}
.dias{display:flex;gap:6px;flex-wrap:wrap}
.dias label{margin:0}
.dias input{position:absolute;opacity:0}
.dias span{display:block;padding:8px 12px;border-radius:999px;border:1px solid var(--linha);background:var(--painel);color:var(--tinta);cursor:pointer}
.dias input:checked+span{background:var(--campo);color:#fff;border-color:var(--campo)}
.dias input:focus-visible+span{outline:3px solid var(--ouro)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--campo);color:#fff;font:700 1.15rem var(--cond);cursor:pointer;min-height:48px}
.btn.sec{background:var(--painel);color:var(--tinta);border:1px solid var(--linha)}
.btn.perigo{background:none;color:var(--der);border:1px solid var(--der)}
.acoes{display:grid;gap:8px;margin-top:16px}
.lst{background:var(--painel);border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.lst div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--linha)}
.lst div:last-child{border-bottom:0}
.lst b{font-weight:600}
.lst div>span+span{margin-left:auto;font-weight:600}
.lst button{background:none;border:0;color:var(--suave);cursor:pointer;font-size:1.1rem;padding:4px}
.vazio{padding:14px;color:var(--suave);text-align:center;font-size:.9rem}
.linha-t{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px}
.linha-t h2{margin:0}
.lnk{background:none;border:0;color:var(--campo);font-weight:600;cursor:pointer;padding:6px 0}
@media (prefers-color-scheme: dark){.lnk{color:var(--ouro)}}
.custo-bar{margin-bottom:10px}
.custo-bar div{display:flex;justify-content:space-between;font-size:.9rem}
.custo-bar s{display:block;height:10px;border-radius:5px;background:var(--fundo);margin-top:4px;overflow:hidden;text-decoration:none;border:1px solid var(--linha)}
.custo-bar s i{display:block;height:100%;background:var(--campo)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:6px 12px;border-radius:999px;border:1px solid var(--linha);background:var(--painel);font-size:.85rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--tinta);color:var(--fundo);border-color:var(--tinta)}
.orc{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:14px}
.orc .big{font:800 2rem var(--cond)}
.medidor{height:14px;border-radius:7px;background:var(--fundo);border:1px solid var(--linha);overflow:hidden;margin:10px 0 6px}
.medidor i{display:block;height:100%}
.trofeu{display:flex;gap:12px;align-items:center}
.trofeu .pos{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 .95rem var(--cond);flex:none;background:var(--ouro);color:#1B2430;text-align:center;line-height:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tinta);color:var(--fundo);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.google{display:flex;align-items:center;gap:10px;justify-content:center}
:root[data-theme="dark"] nav button[aria-current="page"],:root[data-theme="dark"] .lnk{color:var(--ouro)}
:root[data-theme="light"] nav button[aria-current="page"],:root[data-theme="light"] .lnk{color:var(--campo)}
.cx small{display:block;font-size:.75rem;color:var(--suave);margin-top:2px}
.jogo small.time-pr{font-weight:700;color:var(--tinta)}
.tag.mod{background:var(--campo);color:#fff;border-color:var(--campo)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:4px;gap:4px;margin-top:12px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font:700 1.05rem var(--cond);cursor:pointer;color:var(--suave)}
.seg button[aria-selected="true"]{background:var(--campo);color:#fff}
.orc+.orc{margin-top:10px}
.orc h3{font-size:1.15rem;margin-bottom:6px}
.escudo{object-fit:contain;vertical-align:middle;flex:none}
.jogo small.time-pr{display:flex;align-items:center;gap:6px}
.fig-times{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.fig-times img{width:30px;height:30px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.esc-vazio{display:inline-grid;place-items:center;border-radius:50%;background:var(--fundo);border:1px solid var(--linha);font:700 .7rem var(--cond);color:var(--suave);flex:none}
.time-lin{display:flex;align-items:center;gap:12px}
.time-lin img,.time-lin .esc-vazio{width:44px;height:44px}
.lst label.lnk{margin:0;font-size:.9rem;cursor:pointer}
.lst label.lnk input{display:none}
.media-nota{display:inline-flex;align-items:baseline;gap:6px;margin-top:8px;background:var(--ouro);color:#1B2430;border-radius:999px;padding:3px 12px}
.media-nota b{font:800 1.35rem/1.1 var(--cond)}.media-nota span{font-size:.78rem;font-weight:600}
.nota{display:inline-block;min-width:40px;text-align:center;font:800 1.05rem/1 var(--cond);padding:5px 6px;border-radius:8px;color:#fff;margin-top:4px}
.nota.alta{background:var(--vit)}.nota.media{background:var(--emp)}.nota.baixa{background:var(--der)}
.nota-prev{display:flex;gap:12px;align-items:center;background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:12px;margin-top:10px}
.nota-prev .nota{font-size:1.7rem;min-width:62px;padding:10px 6px;margin:0}
.nota-prev ul{margin:0;padding:0;list-style:none;font-size:.85rem;color:var(--suave);flex:1}
.nota-prev li{display:flex;justify-content:space-between;gap:8px}
.cores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cor{border:2px solid var(--linha);background:var(--painel);border-radius:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem}
.cor[aria-pressed="true"]{border-color:var(--tinta)}
.cor i{display:flex;width:100%;height:30px;border-radius:8px;overflow:hidden}
.cor i s{flex:3;text-decoration:none}.cor i u{flex:1;text-decoration:none}
.barra-status{max-width:560px;margin:0 auto;padding:0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.status{display:block;width:100%;margin-top:8px;border:0;border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:600;text-align:center;cursor:pointer}
.status[hidden]{display:none}
.status.ok{background:#DDF1E4;color:#0A5530}.status.pend{background:#FFF1C7;color:#6B5200}
.status.off{background:#F3DCDA;color:#8A231D}.status.erro{background:#D6453D;color:#fff}.status.loc{background:var(--painel);color:var(--suave);border:1px solid var(--linha)}
.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:30px 6px;text-align:center}
.login-marca{width:132px;height:160px;margin:0 auto 10px;border-radius:18px;background:var(--campo);border:3px solid var(--ouro);display:grid;place-items:center;font:800 5rem/1 var(--cond);color:var(--ouro)}
.login h1{font-size:2.6rem;font-weight:800}
.login p{margin:0 auto 10px;max-width:34ch;color:var(--suave)}
.login .login-nota{font-size:.82rem;margin-top:6px}
.login-id{text-align:left}
.btn.ouro{background:var(--ouro);color:#1B2430}
.btn.fantasma{background:none;color:var(--tinta);border:1px solid var(--linha)}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<div class="barra-status"><button class="status" id="status" hidden onclick="cliqueStatus()"></button></div>
<div class="app" id="app"></div>

<nav aria-label="Navegação principal"><div class="in">
  <button data-v="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-v="jogos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg>Jogos</button>
  <button class="mais" id="novo" aria-label="Registrar jogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-v="custos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Custos</button>
  <button data-v="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Atleta</button>
</div></nav>

<div class="veu" id="veu"></div>
<section class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="folhaT"><div class="in" id="folhaIn"></div></section>

const escudoDe=t=>(S.escudos&&S.escudos[t])||ESC_PADRAO[t]||'';
function escImg(t,px){
  const s=escudoDe(t);
  if(s) return `<img class="escudo" src="${s}" alt="" width="${px}" height="${px}">`;
  const ini=String(t||'?').split(/\s+/).filter(w=>w.length>2).map(w=>w[0]).join('').slice(0,3).toUpperCase()||'?';
  return `<span class="esc-vazio" style="width:${px}px;height:${px}px;font-size:${Math.max(8,px*.36)}px" aria-hidden="true">${esc(ini)}</span>`;
}

/* filtros */
function passa(item,campoData='data'){
  const f=S.filtro, d=item[campoData]||item.mes||'';
  if(f.time&&item.time&&item.time!==f.time) return false;
  if(f.temporada&&d.slice(0,4)!==f.temporada) return false;
  if(f.mes&&d.slice(5,7)!==f.mes) return false;
  return true;
}
function barraFiltros(){
  const anos=[...new Set(S.jogos.map(j=>(j.data||'').slice(0,4)).filter(Boolean).concat(String(ANO)))].sort().reverse();
  return `<div class="filtros" role="group" aria-label="Filtros">
   <select aria-label="Time" onchange="S.filtro.time=this.value;salvar(false);render()"><option value="">Todos os times</option>${S.listas.times.map(t=>`<option ${S.filtro.time===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
   <select aria-label="Temporada" onchange="S.filtro.temporada=this.value;salvar(false);render()"><option value="">Todas as temporadas</option>${anos.map(a=>`<option ${S.filtro.temporada===a?'selected':''}>${a}</option>`).join('')}</select>
   <select aria-label="Mês" onchange="S.filtro.mes=this.value;salvar(false);render()"><option value="">Ano inteiro</option>${MESES_L.map((m,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${S.filtro.mes===v?'selected':''}>${m}</option>`}).join('')}</select>
  </div>`;
}

let vista='inicio', busca='', tiposCusto=null;
function render(){
  document.querySelectorAll('nav [data-v]').forEach(b=>b.dataset.v===vista?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  const nav=document.querySelector('nav');
  if(!CFG.modo){ nav.hidden=true; $('#app').innerHTML=telaLogin(); setStatus(); return; }
  nav.hidden=false;

}

function figurinha(js){
  const p=S.perfil, conc=js.filter(j=>j.status!=='agendado');

  return `<div class="figurinha">

      <div class="foto">${p.foto?`<img src="${p.foto}" alt="Foto de ${esc(p.nome)}">`:ini}</div>

      <div class="fig-info">${esc(p.posicao)}, ${catAtual()}</div>

      <div class="media-nota"><b>${fNota(mediaNotas(conc))}</b><span>nota média</span></div></div>
    </div>
    <div class="fig-rodape">
      <div><b>${conc.length}</b><span>jogos</span></div>
      <div><b>${conc.reduce((s,j)=>s+(+j.gols||0),0)}</b><span>gols</span></div>

      <div><b>${conc.filter(j=>j.destaque).length}</b><span>craque</span></div>
    </div></div>`;
}

/* nota por jogo */
function calcNota(j){
  if(j.status==='agendado'||!resultado(j)) return null;
  const it=[['Base',6]], n=k=>+j[k]||0;
  if(n('gols')) it.push([`${n('gols')} gol${n('gols')>1?'s':''}`, n('gols')*1]);
  if(n('ast')) it.push([`${n('ast')} assistência${n('ast')>1?'s':''}`, n('ast')*0.7]);
  if(n('chutes')) it.push([`${n('chutes')} chute${n('chutes')>1?'s':''} a gol`, n('chutes')*0.1]);
  if(n('passes')) it.push([`${n('passes')} passe${n('passes')>1?'s':''} certo${n('passes')>1?'s':''}`, n('passes')*0.05]);
  if(n('recup')) it.push([`${n('recup')} bola${n('recup')>1?'s':''} recuperada${n('recup')>1?'s':''}`, n('recup')*0.15]);
  if(j.destaque) it.push(['Craque do jogo',1]);
  const r=resultado(j); if(r==='V') it.push(['Vitória',0.5]); if(r==='D') it.push(['Derrota',-0.5]);
  if(n('min')>=15) it.push(['15 minutos ou mais em quadra',0.3]);
  if(j.goleiro){
    if(n('def_')) it.push([`${n('def_')} defesa${n('def_')>1?'s':''}`, n('def_')*0.3]);
    if(n('defd')) it.push([`${n('defd')} defesa${n('defd')>1?'s difíceis':' difícil'}`, n('defd')*0.6]);
    if(n('plong')) it.push([`${n('plong')} passe${n('plong')>1?'s':''} longo${n('plong')>1?'s':''} certo${n('plong')>1?'s':''}`, n('plong')*0.1]);
    if(n('saidas')) it.push([`${n('saidas')} saída${n('saidas')>1?'s':''} como último jogador`, n('saidas')*0.2]);
    if(+j.gc===0) it.push(['Sem sofrer gols',0.5]); else if(+j.gc>2) it.push([`${j.gc} gols sofridos`, -(j.gc-2)*0.3]);
  }
  const v=Math.max(4,Math.min(10,it.reduce((s,x)=>s+x[1],0)));
  return {v:Math.round(v*10)/10,it};
}
const fNota=v=>v==null?'-':v.toFixed(1).replace('.',',');
const clsNota=v=>v>=8?'alta':v>=6?'media':'baixa';
function mediaNotas(js){ const n=js.map(calcNota).filter(Boolean).map(x=>x.v); return n.length?n.reduce((a,b)=>a+b,0)/n.length:null; }

  const gm=Array(12).fill(0); conc.forEach(j=>gm[+j.data.slice(5,7)-1]+=+j.gols||0);
  const mx=Math.max(1,...gm);
  const notas=conc.map(calcNota).filter(Boolean).map(x=>x.v);

             +S.individuais.filter(c=>!S.filtro.time||c.time===S.filtro.time).length;

  return `${figurinha(js)}
  ${barraFiltros()}
  <h2>Resultados</h2>
  <div class="placar-geral"><div class="V"><b>${r.V}</b><span>vitórias</span></div><div class="E"><b>${r.E}</b><span>empates</span></div><div class="D"><b>${r.D}</b><span>derrotas</span></div></div>
  <div class="forma" aria-label="Últimos resultados">${conc.slice(-10).map(j=>{const x=resultado(j);return x?`<i class="${x}" title="${esc(j.adv)} ${j.gp}x${j.gc}">${x}</i>`:''}).join('')}</div>
  <h2>Números do atleta</h2>
  <div class="grade">
    ${caixa(minutos,'minutos jogados',`${conc.length?Math.round(minutos/conc.length):0} por jogo`)}
    ${caixa(porJ(soma(conc,'gols'),conc.length),'gols por jogo')}
    ${caixa(soma(conc,'ast'),'assistências')}
    ${caixa(soma(conc,'chutes'),'chutes a gol')}
    ${caixa(soma(conc,'passes'),'passes certos')}
    ${caixa(soma(conc,'recup'),'bolas recuperadas')}
    ${caixa((conc.length?Math.round(r.V/conc.length*100):0)+'%','aproveitamento')}
    ${caixa(fNota(mediaNotas(conc)),'nota média')}
    ${caixa(fNota(notas.length?Math.max(...notas):null),'melhor nota')}
  </div>
  ${gk.length?`<h2>Como goleiro</h2>
  <div class="grade">
    ${caixa(gk.length,'jogos no gol')}
    ${caixa(porJ(soma(gk,'gc'),gk.length),'gols sofridos por jogo')}
    ${caixa(porJ(soma(gk,'def_'),gk.length),'defesas por jogo')}
    ${caixa(soma(gk,'defd'),'defesas difíceis')}
    ${caixa(soma(gk,'plong'),'passes longos certos')}
    ${caixa(soma(gk,'saidas'),'saídas como último jogador')}
    ${caixa(soma(gk,'gols'),'gols marcados')}

  </div>`:''}
  <h2>Treinos</h2>
  ${tr.length?`<div class="grade">
    ${caixa(tr.length,'treinos')}
    ${caixa(fHoras(horasTr),'horas treinadas')}
    ${caixa(fHoras(Math.round(horasTr/tr.length*10)/10),'média por treino')}
  </div>`:`<div class="lst"><div class="vazio">Nenhum treino no período. Registre pelo botão +.</div></div>`}
  <h2>Gols por mês</h2>
  <div class="barras">${gm.map(v=>`<div><em>${v||''}</em><s style="height:${Math.round(v/mx*88)}px"></s></div>`).join('')}</div>

function custos(){
  const js=S.jogos.filter(j=>passa(j));
  const mens=S.mensalidades.filter(m=>passa(m,'mes'));
  const unif=S.uniformes.filter(u=>passa(u));
  const log=S.logistica.filter(l=>passa(l));
  const tipos={
    'Inscrição':js.reduce((s,j)=>s+(+j.insc||0),0),
    'Arbitragem':js.reduce((s,j)=>s+(+j.arb||0),0),
    'Mensalidade':mens.reduce((s,m)=>s+(+m.valor||0),0),
    'Combustível':js.reduce((s,j)=>s+(+j.comb||0),0)+log.filter(l=>l.tipo==='Combustível').reduce((s,l)=>s+(+l.valor),0),
    'Estacionamento':js.reduce((s,j)=>s+(+j.est||0),0)+log.filter(l=>l.tipo==='Estacionamento').reduce((s,l)=>s+(+l.valor),0),
    'Alimentação':js.reduce((s,j)=>s+(+j.alim||0),0)+log.filter(l=>l.tipo==='Alimentação').reduce((s,l)=>s+(+l.valor),0),
    'Uniformes':unif.reduce((s,u)=>s+(+u.valor||0),0)
  };
  if(!tiposCusto) tiposCusto=Object.keys(tipos);
  const total=Object.entries(tipos).filter(([k])=>tiposCusto.includes(k)).reduce((s,[,v])=>s+v,0);
  const mx=Math.max(1,...Object.values(tipos));
  // orçamento: mês do filtro ou mês atual
  const mesRef=(S.filtro.temporada||String(ANO))+'-'+(S.filtro.mes||String(new Date().getMonth()+1).padStart(2,'0'));
  const noMes=d=>(d||'').startsWith(mesRef), porTime=x=>!S.filtro.time||x.time===S.filtro.time;
  const gastoJ=S.jogos.filter(j=>noMes(j.data)&&porTime(j)).reduce((s,j)=>s+custoJogo(j),0)
    +S.logistica.filter(l=>noMes(l.data)&&porTime(l)).reduce((s,l)=>s+(+l.valor||0),0);
  const gastoF=S.mensalidades.filter(m=>m.mes===mesRef&&porTime(m)).reduce((s,m)=>s+(+m.valor||0),0)
    +S.uniformes.filter(u=>noMes(u.data)&&porTime(u)).reduce((s,u)=>s+(+u.valor||0),0);
  const orc=S.orcamentos[S.filtro.time||'']||{jogos:0,fixos:0};
  const [ma,mm]=mesRef.split('-');
  return `<h2 style="margin-top:18px">Custos</h2>${barraFiltros()}
  ${painelOrc('Jogos e logística','Inscrição, arbitragem, combustível, estacionamento e alimentação',gastoJ,orc.jogos,'jogos',MESES_L[+mm-1])}
  ${painelOrc('Mensalidades e uniformes','Mensalidades e compras de uniforme',gastoF,orc.fixos,'fixos',MESES_L[+mm-1])}
  <div class="linha-t"><h2>Por tipo</h2><b style="font:800 1.4rem var(--cond)">${brl(total)}</b></div>
  <div class="chips">${Object.keys(tipos).map(k=>`<button aria-pressed="${tiposCusto.includes(k)}" onclick="alternaTipo('${k}')">${k}</button>`).join('')}</div>
  ${Object.entries(tipos).filter(([k])=>tiposCusto.includes(k)).map(([k,v])=>`<div class="custo-bar"><div><span>${k}</span><b>${brl(v)}</b></div><s><i style="width:${v/mx*100}%"></i></s></div>`).join('')}
  <div class="linha-t"><h2>Mensalidades</h2><button class="lnk" onclick="formMens()">Adicionar</button></div>
  ${listaSimples(mens.sort((a,b)=>b.mes.localeCompare(a.mes)),m=>`<span><b>${MESES_L[+m.mes.slice(5)-1]} ${m.mes.slice(0,4)}</b><br><small class="muted">${esc(m.time)}</small></span><span>${brl(m.valor)}</span>`,'mensalidades','Nenhuma mensalidade no período.')}
  <div class="linha-t"><h2>Custo logístico avulso</h2><button class="lnk" onclick="formLog()">Adicionar</button></div>
  ${listaSimples(log,l=>`<span><b>${esc(l.tipo)}</b><br><small class="muted">${fData(l.data)} ${esc(l.desc||'')}</small></span><span>${brl(l.valor)}</span>`,'logistica','Custos de combustível, estacionamento e alimentação fora dos jogos.')}
  <div class="linha-t"><h2>Uniformes</h2><button class="lnk" onclick="formUnif()">Adicionar</button></div>
  ${listaSimples(unif,u=>`<span><b>${esc(u.tipo)}</b><br><small class="muted">${fData(u.data)} ${esc(u.time||'')}</small></span><span>${brl(u.valor)}</span>`,'uniformes','Nenhum uniforme registrado.')}`;
}
function painelOrc(titulo,desc,gasto,orc,campo,mes){
  const alvo=S.filtro.time?esc(S.filtro.time):'Todos os times';
  if(!(+orc)) return `<div class="orc"><h3>${titulo}, ${mes}</h3><div class="muted" style="font-size:.85rem">${desc}. ${alvo}.</div>
    <div class="big" style="margin-top:8px">${brl(gasto)}</div><div class="muted">gastos no mês, sem orçamento definido</div>
    <button class="lnk" onclick="editarOrcamento('${campo}')">Definir orçamento mensal</button></div>`;
  const pct=Math.min(100,gasto/orc*100), sobra=orc-gasto;
  return `<div class="orc"><h3>${titulo}, ${mes}</h3><div class="muted" style="font-size:.85rem">${desc}. ${alvo}.</div>
    <div class="big" style="margin-top:8px">${brl(gasto)}</div><div class="muted">gastos de ${brl(orc)} disponíveis</div>
    <div class="medidor"><i style="width:${pct}%;background:${pct>=100?'var(--der)':pct>80?'var(--emp)':'var(--vit)'}"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:.9rem"><span>${sobra>=0?'Disponível':'Acima do orçamento'}</span><b>${brl(Math.abs(sobra))}</b></div>
    <button class="lnk" onclick="editarOrcamento('${campo}')">Alterar orçamento mensal</button></div>`;
}
function listaSimples(arr,fn,col,vazio){

  return `<div class="lst">${arr.map(x=>`<div>${fn(x)}<button aria-label="Remover" onclick="remover('${col}','${x.id}')">✕</button></div>`).join('')}</div>`;
}

function carregarEscudo(inp,i){
  const f=inp.files[0], t=S.listas.times[i]; if(!f||!t) return;
  const img=new Image(), r=new FileReader();
  r.onload=()=>{img.onload=()=>{const k=Math.min(1,128/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);

function gisPronto(){
  return new Promise((res,rej)=>{let n=0;const t=setInterval(()=>{
    if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(t);res();}
    else if(++n>80){clearInterval(t);rej(new Error('Não foi possível carregar o login do Google. Verifique a internet.'));}
  },100);});

async function pedirToken(prompt){
  await gisPronto();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:clientId(),scope:SCOPES,
      callback:r=>{ if(r.error){rej(Object.assign(new Error(r.error_description||r.error),{auth:true}));return;}
        CFG.token=r.access_token; CFG.exp=Date.now()+((+r.expires_in||3600)-60)*1000; salvarCfg(); res(r.access_token); },
      error_callback:e=>rej(Object.assign(new Error(e.type==='popup_closed'?'Login cancelado':'Login não concluído'),{auth:true}))});
    tc.requestAccessToken({prompt});
  });
}
async function api(url,opts={}){
  if(!tokenValido()) throw Object.assign(new Error('Sessão do Google expirada'),{auth:true});
  const h={Authorization:'Bearer '+CFG.token,...(opts.headers||{})};
  if(typeof opts.body==='string') h['Content-Type']='application/json';
  const r=await fetch(url,{...opts,headers:h});
  if(r.status===401){CFG.token='';salvarCfg();throw Object.assign(new Error('Sessão do Google expirada'),{auth:true});}
  if(!r.ok){let m='';try{m=(await r.json()).error.message;}catch(e){}throw Object.assign(new Error(`Google respondeu ${r.status}${m?': '+m:''}`),{status:r.status});}
  return r.status===204?null:r.json();
}

/* estrutura da planilha */
const TAB={
  'Jogos':{col:'jogos',cols:[['id','ID'],['data','Data','d'],['hora','Hora','h'],['time','Time'],['adv','Adversário'],['comp','Competição'],['local','Local'],['mod','Modalidade'],['cat','Categoria'],['fase','Fase'],['status','Status','s'],['gp','Gols meu time','nn'],['gc','Gols adversário','nn'],['_res','Resultado','x'],['gols','Gols','n'],['ast','Assistências','n'],['min','Minutos','n'],['chutes','Chutes a gol','n'],['passes','Passes certos','n'],['recup','Bolas recuperadas','n'],['goleiro','Goleiro','b'],['def_','Defesas','n'],['plong','Passes longos certos','n'],['saidas','Saídas último jogador','n'],['defd','Defesas difíceis','n'],['destaque','Destaque','b'],['_nota','Nota','x'],['insc','Inscrição','n'],['arb','Arbitragem','n'],['comb','Combustível','n'],['est','Estacionamento','n'],['alim','Alimentação','n'],['_custo','Custo total','x'],['fotos','Link fotos'],['link','Link jogo'],['obs','Observações']]},
  'Mensalidades':{col:'mensalidades',cols:[['id','ID'],['mes','Mês','m'],['time','Time'],['valor','Valor','n']]},
  'Logística':{col:'logistica',cols:[['id','ID'],['data','Data','d'],['tipo','Tipo'],['valor','Valor','n'],['time','Time'],['desc','Descrição']]},
  'Uniformes':{col:'uniformes',cols:[['id','ID'],['data','Data','d'],['tipo','Tipo'],['valor','Valor','n'],['time','Time']]},
  'Conquistas':{col:'conquistas',cols:[['id','ID'],['camp','Campeonato'],['posicao','Colocação'],['temporada','Temporada'],['time','Time']]},
  'Prêmios':{col:'individuais',cols:[['id','ID'],['premio','Prêmio'],['camp','Campeonato'],['time','Time']]},
  'Fotos':{col:'fotosEspeciais',cols:[['id','ID'],['titulo','Título'],['url','Link']]},
  'Treinos':{col:'treinosReg',cols:[['id','ID'],['data','Data','d'],['time','Time'],['mod','Modalidade'],['cat','Categoria'],['horas','Horas','n'],['obs','Observações']]}
};
const ABAS=[...Object.keys(TAB),'Cadastro','Listas','Orçamentos','Escudos'];
const LISTAS=[['times','Meus times'],['competicoes','Competições'],['locais','Locais'],['equipes','Adversários'],['categorias','Categorias']];
const rng=n=>`'${n}'!A1:AZ`;

function serialData(v){ return new Date(Date.UTC(1899,11,30)+Math.round(v*864e5)); }
function lerData(v){
  if(v===''||v==null) return '';
  if(typeof v==='number') return serialData(v).toISOString().slice(0,10);
  const s=String(v).trim(), m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:s.slice(0,10);
}
function lerHora(v){
  if(v===''||v==null) return '';
  if(typeof v==='number'){const t=Math.round((v%1)*1440);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
  return String(v).slice(0,5);
}
function lerMes(v){ if(typeof v==='number') return serialData(v).toISOString().slice(0,7); const s=String(v||''); const m=s.match(/^(\d{1,2})\/(\d{4})/); return m?`${m[2]}-${m[1].padStart(2,'0')}`:s.slice(0,7); }

function paraLinhas(t){
  const out=[t.cols.map(c=>c[1])];
  (S[t.col]||[]).forEach(o=>out.push(t.cols.map(([k,,tp])=>{
    if(k==='_res') return RES_N[resultado(o)]||'';
    if(k==='_custo') return custoJogo(o);
    if(k==='_nota'){ const n=calcNota(o); return n?n.v:''; }
    if(tp==='b') return o[k]?'Sim':'Não';
    if(tp==='s') return o.status==='agendado'?'Agendado':'Concluído';
    const v=o[k]; return v==null?'':v;
  })));
  return out;
}
function deLinhas(t,vals){
  if(!vals||!vals.length) return [];
  const idx={}; vals[0].forEach((h,i)=>idx[String(h).trim()]=i);
  return vals.slice(1).filter(r=>r.some(c=>c!==''&&c!=null)).map(r=>{
    const o={};
    t.cols.forEach(([k,h,tp])=>{
      if(tp==='x') return;
      const v=idx[h]==null?'':(r[idx[h]]??'');
      o[k]= tp==='n'?(+String(v).replace(',','.')||0)
          : tp==='nn'?(v===''?null:+String(v).replace(',','.'))
          : tp==='b'?(idx[h]==null?undefined:(v===true||/^s/i.test(String(v))))
          : tp==='s'?(/agend|não/i.test(String(v))?'agendado':'concluido')
          : tp==='d'?lerData(v) : tp==='h'?lerHora(v) : tp==='m'?lerMes(v) : String(v);
    });
    if(!o.id) o.id=t.col.slice(0,1)+uid();
    if(t.col==='jogos') o.temporada=+String(o.data).slice(0,4)||ANO;
    return o;
  });
}
function cadastroLinhas(){
  const p=S.perfil;
  return [['Campo','Valor'],['Nome',p.nome],['Número',p.numero],['Posição',p.posicao],['Ano de nascimento',p.ano],['Categoria',p.categoria||''],['Categoria atual',catAtual()],
    ['Responsável 1',p.resp[0].nome],['Telefone 1',p.resp[0].tel],['Responsável 2',p.resp[1].nome],['Telefone 2',p.resp[1].tel],
    ['Foto',p.foto||'']];
}
function deCadastro(vals){
  const m={}; (vals||[]).slice(1).forEach(r=>m[String(r[0]).trim()]=r[1]??'');
  if(!Object.keys(m).length) return;
  const p=S.perfil;
  p.nome=String(m['Nome']??p.nome); p.numero=String(m['Número']??p.numero); p.posicao=String(m['Posição']||p.posicao);
  p.ano=+m['Ano de nascimento']||p.ano;
  p.resp=[{nome:String(m['Responsável 1']||''),tel:String(m['Telefone 1']||'')},{nome:String(m['Responsável 2']||''),tel:String(m['Telefone 2']||'')}];
  p.foto=String(m['Foto']||'');
  if(m['Categoria']!==undefined) p.categoria=String(m['Categoria']||'');
  if(m['Orçamento mensal']!==undefined) S.orcamento=+String(m['Orçamento mensal']).replace(',','.')||0;
}
function escLinhas(){ return [['Time','Escudo'],...Object.entries(S.escudos||{}).filter(([,v])=>v).map(([k,v])=>[k,v])]; }
function deEsc(vals){ if(!vals||vals.length<2) return; const o={}; vals.slice(1).forEach(r=>{ if(r[0]&&r[1]) o[String(r[0]).trim()]=String(r[1]); }); S.escudos=o; }
function orcLinhas(){
  return [['Time','Jogos e logística','Mensalidades e uniformes'],...Object.entries(S.orcamentos).map(([k,v])=>[k||'Todos',+v.jogos||0,+v.fixos||0])];
}
function deOrc(vals){
  if(!vals||vals.length<2) return;
  const o={}; vals.slice(1).forEach(r=>{ if(r[0]===''||r[0]==null) return; const k=String(r[0]).trim()==='Todos'?'':String(r[0]).trim(); o[k]={jogos:+String(r[1]??0).replace(',','.')||0,fixos:+String(r[2]??0).replace(',','.')||0}; });
  if(Object.keys(o).length) S.orcamentos=o;
}
function listasLinhas(){
  const mx=Math.max(...LISTAS.map(([k])=>S.listas[k].length));
  const out=[LISTAS.map(l=>l[1])];
  for(let i=0;i<mx;i++) out.push(LISTAS.map(([k])=>S.listas[k][i]??''));
  return out;
}
function deListas(vals){
  if(!vals||!vals.length) return;
  const idx={}; vals[0].forEach((h,i)=>idx[String(h).trim()]=i);
  LISTAS.forEach(([k,h])=>{ if(idx[h]!=null) S.listas[k]=vals.slice(1).map(r=>String(r[idx[h]]??'').trim()).filter(Boolean); });
}

async function criarPlanilha(){
  const r=await api(SHEETS,{method:'POST',body:JSON.stringify({
    properties:{title:'Diário Esportivo - '+(S.perfil.nome||'Atleta'),locale:'pt_BR',timeZone:'America/Fortaleza'},
    sheets:ABAS.map(n=>({properties:{title:n,gridProperties:{frozenRowCount:1}}}))})});
  CFG.sheetId=r.spreadsheetId; salvarCfg();
  await api(`${DRIVE}/${r.spreadsheetId}`,{method:'PATCH',body:JSON.stringify({appProperties:{app:APP_TAG}})});
  await api(`${SHEETS}/${r.spreadsheetId}:batchUpdate`,{method:'POST',body:JSON.stringify({requests:r.sheets.map(s=>({repeatCell:{
    range:{sheetId:s.properties.sheetId,startRowIndex:0,endRowIndex:1},
    cell:{userEnteredFormat:{backgroundColor:{red:.055,green:.42,blue:.227},textFormat:{bold:true,foregroundColor:{red:1,green:1,blue:1}}}},
    fields:'userEnteredFormat(backgroundColor,textFormat)'}}))})});
}
async function acharPlanilha(){
  if(CFG.sheetId){
    try{const f=await api(`${DRIVE}/${CFG.sheetId}?fields=id,trashed`); if(!f.trashed) return f.id;}catch(e){if(e.auth)throw e;}
  }
  const q=encodeURIComponent(`appProperties has { key='app' and value='${APP_TAG}' } and trashed=false and mimeType='application/vnd.google-apps.spreadsheet'`);
  const r=await api(`${DRIVE}?q=${q}&orderBy=modifiedTime desc&fields=files(id,name)`);
  return r.files&&r.files[0]?r.files[0].id:null;
}
async function garantirAbas(){
  const r=await api(`${SHEETS}/${CFG.sheetId}?fields=sheets.properties.title`);
  const tem=r.sheets.map(s=>s.properties.title), falta=ABAS.filter(a=>!tem.includes(a));
  if(falta.length) await api(`${SHEETS}/${CFG.sheetId}:batchUpdate`,{method:'POST',body:JSON.stringify({requests:falta.map(t=>({addSheet:{properties:{title:t,gridProperties:{frozenRowCount:1}}}}))})});
}
async function enviar(){
  const id=CFG.sheetId; await garantirAbas();
  await api(`${SHEETS}/${id}/values:batchClear`,{method:'POST',body:JSON.stringify({ranges:ABAS.map(rng)})});
  await api(`${SHEETS}/${id}/values:batchUpdate`,{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:[
    ...Object.entries(TAB).map(([n,t])=>({range:`'${n}'!A1`,values:paraLinhas(t)})),
    {range:"'Cadastro'!A1",values:cadastroLinhas()},{range:"'Listas'!A1",values:listasLinhas()},{range:"'Orçamentos'!A1",values:orcLinhas()},{range:"'Escudos'!A1",values:escLinhas()}]})});
  CFG.ultimaSync=Date.now(); salvarCfg();
}
async function baixar(){
  await garantirAbas();
  const q=ABAS.map(n=>'ranges='+encodeURIComponent(rng(n))).join('&');
  const r=await api(`${SHEETS}/${CFG.sheetId}/values:batchGet?${q}&valueRenderOption=UNFORMATTED_VALUE`);
  const v={}; r.valueRanges.forEach((vr,i)=>v[ABAS[i]]=vr.values||[]);
  Object.entries(TAB).forEach(([n,t])=>{S[t.col]=deLinhas(t,v[n]);});
  deCadastro(v['Cadastro']); deListas(v['Listas']); deOrc(v['Orçamentos']); deEsc(v['Escudos']); normalizar();
  localStorage.setItem(KEY,JSON.stringify(S)); CFG.ultimaSync=Date.now(); salvarCfg();
}

/* sincronização */
let sincronizando=false, timerSync=null, statusAtual={k:'',msg:''};
function marcarAlteracao(){ if(CFG.modo!=='google')return; CFG.dirty=true; salvarCfg(); setStatus(navigator.onLine?'pendente':'offline'); clearTimeout(timerSync); timerSync=setTimeout(sincronizar,1500); }
async function sincronizar(){
  if(CFG.modo!=='google'||!CFG.sheetId) return setStatus('local');
  if(!navigator.onLine) return setStatus('offline');
  if(!tokenValido()) return setStatus('reconectar');
  if(sincronizando){clearTimeout(timerSync);timerSync=setTimeout(sincronizar,1500);return;}
  sincronizando=true; setStatus('enviando');
  try{ if(CFG.dirty){CFG.dirty=false;salvarCfg();await enviar();} setStatus(CFG.dirty?'pendente':'ok'); if(CFG.dirty){clearTimeout(timerSync);timerSync=setTimeout(sincronizar,1500);} }
  catch(e){ CFG.dirty=true; salvarCfg(); setStatus(e.auth?'reconectar':'erro',e.message); }
  finally{ sincronizando=false; }
}
async function recarregarDaPlanilha(){
  if(!tokenValido()){ try{await pedirToken('');}catch(e){aviso(e.message);setStatus('reconectar');return;} }
  try{
    setStatus('enviando');
    if(CFG.dirty){CFG.dirty=false;salvarCfg();await enviar();}
    await baixar(); render(); setStatus('ok'); aviso('Dados atualizados da planilha');
  }catch(e){ setStatus(e.auth?'reconectar':'erro',e.message); aviso(e.message); }
}
async function conectar(){
  if(!clientId()){ aviso('Informe o Client ID do Google'); return; }
  try{
    setStatus('conectando');
    await pedirToken(CFG.email?'':'consent');
    if(!CFG.email){ try{const u=await api('https://www.googleapis.com/oauth2/v3/userinfo'); CFG.email=u.email;}catch(e){} }
    const id=await acharPlanilha();
    if(id){
      CFG.sheetId=id; salvarCfg(); await garantirAbas();
      if(CFG.dirty&&CFG.vinculada===id){ CFG.dirty=false; salvarCfg(); await enviar(); }
      else await baixar();
    }else{
      if(!confirm(`Criar a planilha no seu Google Drive com os ${S.jogos.length} jogos que já estão no app?\n\nCancelar cria a planilha vazia.`)) S=vazio();
      await criarPlanilha(); await enviar();
    }
    CFG.modo='google'; CFG.vinculada=CFG.sheetId; CFG.dirty=false; salvarCfg();
    localStorage.setItem(KEY,JSON.stringify(S));
    vista='inicio'; render(); setStatus('ok'); aviso('Conectado ao Google Drive');
  }catch(e){
    setStatus(e.auth?'reconectar':'erro',e.message); aviso(e.message);
    if(!CFG.modo) render();
  }
}
async function reconectar(){
  try{ await pedirToken(''); setStatus('pendente'); CFG.dirty?sincronizar():recarregarDaPlanilha(); }
  catch(e){ aviso(e.message); setStatus('reconectar'); }
}
function sairConta(){
  if(!confirm('Sair da conta Google neste aparelho? Os dados continuam na planilha do Drive.'))return;
  try{ if(CFG.token&&window.google) google.accounts.oauth2.revoke(CFG.token,()=>{}); }catch(e){}
  CFG={clientId:CFG.clientId,tema:CFG.tema,modoCor:CFG.modoCor}; salvarCfg(); vista='inicio'; render(); setStatus('');
}
function usarLocal(){ CFG.modo='local'; salvarCfg(); render(); setStatus('local'); }
function setStatus(k,msg){
  if(k!==undefined) statusAtual={k,msg:msg||''};
  const el=$('#status'); if(!el) return;
  const m={
    ok:['Sincronizado com o Drive','ok'], pendente:['Salvando no Drive','pend'], enviando:['Sincronizando','pend'], conectando:['Conectando ao Google','pend'],
    offline:['Sem internet, salvo no aparelho','off'], reconectar:['Toque para reconectar ao Google','off'],
    erro:['Falha ao sincronizar, toque para tentar de novo','erro'], local:['Dados só neste aparelho','loc']
  }[statusAtual.k];
  if(!m||!CFG.modo){el.hidden=true;return;}
  el.hidden=false; el.className='status '+m[1]; el.textContent=m[0]; el.title=statusAtual.msg;
}
function cliqueStatus(){
  const k=statusAtual.k;
  if(k==='reconectar') reconectar();
  else if(k==='erro'){ CFG.dirty=true; salvarCfg(); sincronizar(); }
  else if(k==='local'){ vista='perfil'; render(); setTimeout(()=>document.getElementById('conta')?.scrollIntoView(),50); }
}
window.addEventListener('online',()=>{ if(CFG.modo==='google') sincronizar(); });
window.addEventListener('offline',()=>{ if(CFG.modo==='google') setStatus('offline'); });

/* fotos no Drive */
async function pastaFotos(){
  if(CFG.folderId){ try{const f=await api(`${DRIVE}/${CFG.folderId}?fields=id,trashed`); if(!f.trashed) return f.id;}catch(e){if(e.auth)throw e;} }
  const q=encodeURIComponent(`appProperties has { key='app' and value='${APP_TAG}-fotos' } and trashed=false`);
  const r=await api(`${DRIVE}?q=${q}&fields=files(id)`);
  if(r.files&&r.files[0]) CFG.folderId=r.files[0].id;
  else CFG.folderId=(await api(DRIVE,{method:'POST',body:JSON.stringify({name:'Diário Esportivo - Fotos',mimeType:'application/vnd.google-apps.folder',appProperties:{app:APP_TAG+'-fotos'}})})).id;
  salvarCfg(); return CFG.folderId;
}
async function enviarFoto(file){
  const pasta=await pastaFotos(), fd=new FormData();
  fd.append('metadata',new Blob([JSON.stringify({name:file.name,parents:[pasta]})],{type:'application/json'}));
  fd.append('file',file);
  return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{method:'POST',body:fd});
}

function salvarClientId(v){
  v=(v||'').trim(); if(!/\.apps\.googleusercontent\.com$/.test(v)){aviso('Client ID inválido');return false;}
  CFG.clientId=v; salvarCfg(); return true;
}

     <div class="acoes">

      <button class="btn sec" onclick="exportar()">Exportar dados (JSON)</button>
      <button class="btn perigo" onclick="if(confirm('Apagar tudo e voltar aos dados das planilhas originais?')){S=inicial();salvar();render();aviso('Dados restaurados')}">Restaurar dados das planilhas</button>
     </div></div>`;
}
function vazio(){ const v=inicial(); v.jogos=[]; v.mensalidades=[]; return v; }

document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>{vista=b.dataset.v;render();});
$('#novo').onclick=()=>abrirJogo('');
aplicarTema();
render();
(async()=>{
  if(CFG.modo!=='google'){ setStatus(CFG.modo==='local'?'local':''); return; }
  if(!navigator.onLine) return setStatus('offline');
  if(!tokenValido()) return setStatus('reconectar');
  setStatus('enviando');
  const pendente=!!CFG.dirty;
  try{
    if(pendente){ CFG.dirty=false; salvarCfg(); await enviar(); }
    else { await baixar(); if(!document.querySelector('.folha.on')) render(); }
    setStatus('ok');
  }catch(e){ if(pendente){CFG.dirty=true;salvarCfg();} setStatus(e.auth?'reconectar':'erro',e.message); }
})();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
